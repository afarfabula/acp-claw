#ENROOT_REMAP_ROOT=y

rc() {
  set -euo pipefail
  export PATH="/usr/local/texlive/2026/bin/x86_64-linux:$PATH"
  tlmgr option repository \
    https://mirrors.tuna.tsinghua.edu.cn/CTAN/systems/texlive/tlnet
  tlmgr update --self
  if ! tlmgr install scheme-full; then
    # TeX Live 2026 currently combines --byengine and --byfmt in one
    # postaction, which fmtutil rejects. Verify the package set, then
    # regenerate the affected formats separately below.
    tlmgr info --only-installed scheme-full >/dev/null
  fi
  fmtutil-sys --byengine euptex || true
  fmtutil-sys --byfmt pdfxmltex || true
  fmtutil-sys --byfmt texsis || true
  fmtutil-sys --byfmt xelatex-dev || true
  fmtutil-sys --byfmt xmltex \
    --no-error-if-no-engine=luametatex,luajithbtex,luajittex,mfluajit,xetex || true
  tlmgr path add
  date -u >/etc/overleaf-scheme-full
}
