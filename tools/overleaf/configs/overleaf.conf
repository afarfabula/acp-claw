#ENROOT_REMAP_ROOT=y

environ() {
  printf '%s\n' \
    'OVERLEAF_APP_NAME=Overleaf' \
    'OVERLEAF_NAV_TITLE=Overleaf' \
    "OVERLEAF_SITE_URL=$OVERLEAF_SITE_URL" \
    "OVERLEAF_ADMIN_EMAIL=$OVERLEAF_ADMIN_EMAIL" \
    "OVERLEAF_SESSION_SECRET=$OVERLEAF_SESSION_SECRET" \
    "OVERLEAF_INVITE_TOKEN_SECRET=$OVERLEAF_INVITE_TOKEN_SECRET" \
    'OVERLEAF_MONGO_URL=mongodb://127.0.0.1:27017/sharelatex?replicaSet=overleaf' \
    'OVERLEAF_REDIS_HOST=127.0.0.1' \
    'REDIS_HOST=127.0.0.1' \
    'OVERLEAF_TRUSTED_PROXY_IPS=loopback' \
    'OVERLEAF_ALLOW_PUBLIC_ACCESS=false' \
    'OVERLEAF_RESTRICT_INVITES_TO_EXISTING_ACCOUNTS=true' \
    'OVERLEAF_DISABLE_LINK_SHARING=true' \
    'EMAIL_CONFIRMATION_DISABLED=true' \
    'ENABLED_LINKED_FILE_TYPES=project_file,project_output_file' \
    'ENABLE_CONVERSIONS=true' \
    'WEB_API_USER=overleaf' \
    'NODE_ENV=production'

  if [ "$OVERLEAF_SECURE_COOKIE" = true ]; then
    printf '%s\n' 'OVERLEAF_SECURE_COOKIE=true'
  fi
}

mounts() {
  printf '%s /var/lib/overleaf none x-create=dir,bind,rw,nosuid,nodev\n' \
    "$OVERLEAF_DATA_ROOT/sharelatex"
  printf '%s /etc/hosts none x-create=file,bind,rw,nosuid,nodev\n' \
    "$OVERLEAF_DATA_ROOT/hosts"
}

rc() {
  exec /sbin/my_init --no-kill-all-on-exit
}
