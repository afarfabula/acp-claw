<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To 金尚美 ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 20%, #43105a 0%, #1d0a33 55%, #0c0518 100%);
      overflow: hidden;
      color: #fff;
      user-select: none;
    }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    .content {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      text-align: center;
      padding: 0 16px;
      pointer-events: none;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .content.away {
      opacity: 0;
      visibility: hidden;
    }
    .heart-wrap { pointer-events: auto; animation: beat 1.25s ease-in-out infinite; filter: drop-shadow(0 0 28px rgba(255, 55, 120, 0.75)); }
    .heart-wrap svg { overflow: visible; }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.13); }
      26% { transform: scale(1.04); }
      40% { transform: scale(1.10); }
      54% { transform: scale(1); }
    }
    svg { width: clamp(120px, 28vmin, 210px); height: auto; display: block; }
    .name {
      margin-top: 26px;
      font-size: clamp(38px, 9vmin, 64px);
      font-weight: 800;
      letter-spacing: 12px;
      text-indent: 12px;
      background: linear-gradient(90deg, #ffd1e1, #ff7fb0, #ff4d94, #ffd1e1);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 4s linear infinite;
      text-shadow: none;
    }
    @keyframes glow {
      from { background-position: 0% 0; }
      to { background-position: 300% 0; }
    }
    .poem {
      margin-top: 14px;
      font-size: clamp(14px, 3.4vmin, 19px);
      color: rgba(255, 226, 239, 0.85);
      letter-spacing: 3px;
      line-height: 1.9;
      text-shadow: 0 0 18px rgba(255, 120, 170, 0.4);
    }
    .question {
      margin-top: 26px;
      font-size: clamp(20px, 5vmin, 30px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 5px;
      animation: fadeSlide 1.2s 0.5s both;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .actions {
      margin-top: 26px;
      display: flex;
      gap: 16px;
      pointer-events: auto;
      animation: fadeSlide 1.2s 0.9s both;
    }
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 40px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.25s;
    }
    .btn-yes {
      background: linear-gradient(135deg, #ff5f95, #ff2e7e);
      color: #fff;
      box-shadow: 0 10px 28px rgba(255, 47, 126, 0.45);
    }
    .btn-wait {
      background: rgba(255, 255, 255, 0.12);
      color: #ffd9e7;
      border: 1px solid rgba(255, 160, 200, 0.4);
      backdrop-filter: blur(6px);
    }
    .btn:hover { transform: translateY(-3px) scale(1.03); }
    .btn:active { transform: scale(0.97); }
    .sign {
      position: absolute;
      bottom: 26px;
      width: 100%;
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(255, 220, 235, 0.5);
      pointer-events: none;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      z-index: 6;
      padding: 10px 22px;
      border-radius: 40px;
      background: rgba(255, 80, 140, 0.2);
      border: 1px solid rgba(255, 150, 190, 0.45);
      backdrop-filter: blur(10px);
      color: #ffe3ee;
      font-size: 15px;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, rgba(255, 45, 120, 0.42), rgba(18, 6, 28, 0.88) 70%, rgba(8, 3, 16, 0.96) 100%);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      max-width: min(92vw, 720px);
      padding: 34px 18px;
      text-align: center;
    }
    .overlay h2 {
      margin: 0;
      font-size: clamp(34px, 9vmin, 64px);
      letter-spacing: 8px;
      text-indent: 8px;
      line-height: 1.3;
      background: linear-gradient(90deg, #ffd1e1, #ff5f95);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pop 0.6s 0.15s both;
    }
    .overlay .sub {
      margin: 0;
      color: rgba(255, 226, 239, 0.9);
      font-size: clamp(17px, 4.5vmin, 24px);
      letter-spacing: 3px;
      line-height: 1.8;
      animation: pop 0.6s 0.4s both;
    }
    .overlay-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 12;
      transition: background 0.2s, transform 0.2s;
    }
    .overlay-close:hover {
      background: rgba(255, 255, 255, 0.26);
      transform: rotate(90deg);
    }
    .confetti {
      position: fixed;
      top: -3vh;
      z-index: 11;
      pointer-events: none;
      opacity: 0.95;
    }
    @keyframes confettiFall {
      to { transform: translateY(115vh) rotate(720deg); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="content">
    <div class="heart-wrap">
      <svg viewBox="0 0 32 29.6">
        <defs>
          <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb6d5" />
            <stop offset="45%" stop-color="#ff4d8e" />
            <stop offset="100%" stop-color="#d61f69" />
          </linearGradient>
        </defs>
        <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2 c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#heartGrad)" />
      </svg>
    </div>
    <div class="name">金尚美</div>
    <div class="poem">
      遇见你之后，<br />我的每一次心动，都有了名字。
    </div>
    <div class="question">做我女朋友，好吗？</div>
    <div class="actions">
      <button class="btn btn-yes" id="yesBtn">我愿意 ❤️</button>
      <button class="btn btn-wait" id="waitBtn">让我想想 💭</button>
    </div>
    <div class="sign">—— 爱你的 JSM · 一颗认真跳动的心 · 2026.09.08</div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay">
    <button class="overlay-close" id="overlayClose" aria-label="关闭">×</button>
    <div class="overlay-inner">
      <h2 id="overlayTitle"></h2>
      <p class="sub" id="overlayText"></p>
    </div>
  </div>

  <script>
    // ---- 星空/光点背景 ----
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const COUNT = 70;
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.8 + 0.3,
        vx: (Math.random() - 0.5) * 0.18,
        vy: -Math.random() * 0.25 - 0.05,
        a: Math.random() * 0.6 + 0.15,
        phase: Math.random() * Math.PI * 2
      });
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      const t = performance.now() / 1000;
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; }
        if (p.x < -4) p.x = w + 4;
        if (p.x > w + 4) p.x = -4;
        const alpha = p.a * (0.55 + 0.45 * Math.sin(t * 1.5 + p.phase));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 170, 205, ${alpha})`;
        ctx.shadowColor = 'rgba(255, 105, 180, 0.9)';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      requestAnimationFrame(draw);
    }
    draw();

    // ---- 漂浮爱心 ----
    function spawnHeart(burst = false) {
      const heart = document.createElement('div');
      heart.textContent = ['❤', '♥', '💖', '💗', '💕'][Math.floor(Math.random() * 5)];
      heart.style.cssText = `
        position: fixed;
        left: ${Math.random() * 100}vw;
        bottom: -6vh;
        font-size: ${14 + Math.random() * 24}px;
        color: rgba(255,${130 + Math.floor(Math.random() * 90)},${180 + Math.floor(Math.random() * 60)},0.8);
        pointer-events: none;
        z-index: 4;
        opacity: 0;
        animation: floatUp ${5 + Math.random() * 6}s ease-in forwards;
        text-shadow: 0 0 12px rgba(255, 80, 140, 0.65);
      `;
      const style = document.createElement('style');
      style.textContent = '@keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 8% { opacity: 0.9; } 100% { transform: translateY(-115vh) rotate(16deg); opacity: 0; } }';
      document.head.appendChild(style);
      document.body.appendChild(heart);
      setTimeout(() => { heart.remove(); style.remove(); }, 11500);
    }
    setInterval(() => spawnHeart(), 380);
    for (let i = 0; i < 12; i++) setTimeout(() => spawnHeart(), i * 160);

    // ---- 按钮交互 ----
    const toast = document.getElementById('toast');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const contentEl = document.querySelector('.content');
    function showToast(text, ms = 2600) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), ms);
    }

    function showOverlay(title, text) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlay.classList.add('show');
      contentEl.classList.add('away');
    }
    function hideOverlay() {
      overlay.classList.remove('show');
      contentEl.classList.remove('away');
    }
    document.getElementById('overlayClose').addEventListener('click', hideOverlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) hideOverlay();
    });

    function burstHearts(n = 90) {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.textContent = ['❤', '♥', '💖', '💗', '💘'][Math.floor(Math.random() * 5)];
        const angle = Math.random() * Math.PI * 2;
        const dist = 80 + Math.random() * Math.min(w, h) * 0.55;
        const size = 16 + Math.random() * 26;
        el.style.cssText = `
          position: fixed;
          left: ${centerX}px;
          top: ${centerY}px;
          font-size: ${size}px;
          z-index: 12;
          pointer-events: none;
          text-shadow: 0 0 14px rgba(255, 70, 130, 0.9);
          transition: transform ${1 + Math.random() * 1.2}s cubic-bezier(.12,.68,.2,.98), opacity 1.4s ease;
        `;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
          el.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) rotate(${(Math.random() - 0.5) * 90}deg)`;
          el.style.opacity = '0.15';
        });
        setTimeout(() => el.remove(), 2500);
      }
    }

    function confettiRain(n = 160) {
      const colors = ['#ff5f95', '#ff2e7e', '#ffd166', '#8ef0a0', '#6cc4ff', '#c084fc', '#ff8fab', '#ffb347'];
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.width = 6 + Math.random() * 8 + 'px';
        el.style.height = 10 + Math.random() * 12 + 'px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animation = `confettiFall ${2.4 + Math.random() * 2.4}s linear ${Math.random() * 0.7}s forwards`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 7500);
      }
    }

    function celebrate() {
      burstHearts(180);
      confettiRain(180);
      setTimeout(() => burstHearts(150), 350);
      setTimeout(() => confettiRain(140), 650);
      setTimeout(() => burstHearts(130), 800);
      for (let i = 0; i < 60; i++) setTimeout(() => spawnHeart(), i * 90);
    }

    document.getElementById('yesBtn').addEventListener('click', () => {
      showOverlay('她说：我愿意！🎉', '余生请多指教，金尚美 ❤️');
      celebrate();
    });

    document.getElementById('waitBtn').addEventListener('click', () => {
      showOverlay('好呀，我等你 ❤️', '那你就慢慢想，多久都行——我会一直在。');
      burstHearts(55);
      setTimeout(() => confettiRain(60), 250);
    });
  </script>
</body>
</html>
